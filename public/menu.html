<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buna Café | Menu</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

    <header class="navbar">

        <a href="/" class="logo">
            ☕ Buna Café
        </a>

        <nav class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/menu.html" class="active">
                Menu
            </a>

            <a href="/about.html">
                About
            </a>

            <a href="/reservation.html">
                Reservation
            </a>

        </nav>

    </header>


    <main class="menu-page">

        <section class="page-header">

            <p class="eyebrow">
                OUR MENU
            </p>

            <h1>
                Crafted for
                <span>Every Taste.</span>
            </h1>

            <p>
                Explore our coffee, tea, pastries,
                and desserts.
            </p>

        </section>


        <section class="menu-controls">

            <input type="text" id="searchInput" placeholder="Search menu...">


            <select id="categoryFilter">

                <option value="">
                    All Categories
                </option>

                <option value="coffee">
                    Coffee
                </option>

                <option value="tea">
                    Tea
                </option>

                <option value="pastry">
                    Pastry
                </option>

                <option value="dessert">
                    Dessert
                </option>

            </select>

        </section>


        <section id="menuContainer" class="menu-grid">

            <p>
                Loading menu...
            </p>

        </section>

    </main>


    <script src="/js/app.js"></script>

</body>

</html>
